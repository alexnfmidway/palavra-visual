<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#12BF86"/>
    <stop offset="0.55" stop-color="#1FB5C9"/>
    <stop offset="1" stop-color="#3B7BFF"/>
  </linearGradient>
  <radialGradient id="sol" cx="0" cy="1" r="0.75">
    <stop offset="0" stop-color="#FFE066" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#FFE066" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="miolo" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect width="512" height="512" fill="#fff"/>
    <circle cx="288" cy="206" r="48" fill="#000"/>
  </mask>
  <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.23  0 0 0 0 0.36  0 0 0 0.4 0"/>
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <clipPath id="metade"><rect x="230" y="150" width="116" height="56"/></clipPath>
  <!-- P que fala: barriga grande + haste que termina em ponta de balão -->
  <g id="p" mask="url(#miolo)">
    <circle cx="288" cy="206" r="110" fill="#fff"/>
    <rect x="160" y="96" width="128" height="220" rx="32" fill="#fff"/>
    <rect x="256" y="96" width="40" height="220" fill="#fff"/>
    <path d="M165 250V415L229 351V250Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  </g>
</defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#sol)"/>
  <rect width="512" height="512" rx="120" fill="url(#brilho)"/>
  <g transform="translate(-23 -2)">
    <use href="#p" filter="url(#sombra)" transform="translate(0 14)"/>
    <use href="#p"/>
    <clipPath id="lente"><circle cx="288" cy="206" r="48"/></clipPath>
    <g clip-path="url(#lente)">
      <circle cx="288" cy="214" r="30" fill="#FFD84D"/>
      <path d="M236 216q13-14 26 0t26 0t26 0t26 0" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>
</svg>